<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Management Portal | CRTC, PUST</title>
<link rel="icon" href="assets/crtc_logo.svg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
<script src="js/config.js"></script>
<script src="js/loader.js"></script>
<script src="js/site.js" defer></script>
</head>
<body>
<div data-site="header"></div>

<main id="main" class="portal">
  <!-- Sign in / register -->
  <section id="auth" class="auth-card" hidden>
    <div class="auth-tabs" role="tablist">
      <button class="on" data-auth="login" role="tab">Sign in</button>
      <button data-auth="register" role="tab">Register</button>
    </div>
    <form id="loginForm" class="stack" autocomplete="on">
      <h1>Management Portal</h1>
      <p class="muted">Sign in to manage test rates, notices and users.</p>
      <label>Username<input name="username" autocomplete="username" required></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn-main wide" type="submit">Sign in</button>
    </form>
    <form id="registerForm" class="stack" hidden autocomplete="off">
      <h1>Request access</h1>
      <p class="muted">An administrator reviews every new account before it can sign in.</p>
      <label>Full name<input name="name" required></label>
      <label>Official email<input name="email" type="email" required></label>
      <div class="two">
        <label>Username<input name="username" pattern="[a-zA-Z0-9._]{3,24}" title="3-24 letters, numbers, dot or underscore" required></label>
        <label>Role requested<select name="role"><option value="faculty">Faculty</option><option value="staff">Staff</option><option value="ra">Research Assistant (RA)</option></select></label>
      </div>
      <label>Password<input name="password" type="password" minlength="10" autocomplete="new-password" required><small class="muted">At least 10 characters, with letters and numbers.</small></label>
      <button class="btn-main wide" type="submit">Submit request</button>
    </form>
    <p id="authMsg" class="msg" role="alert"></p>
  </section>

  <!-- Dashboard -->
  <section id="app" hidden>
    <div class="topbar">
      <div><h1>Management Portal</h1><p class="muted">Signed in as <b id="uName"></b> <span id="uRole" class="badge"></span></p></div>
      <button id="logoutBtn" class="btn-outline"><i class="fas fa-sign-out-alt"></i> Sign out</button>
    </div>
    <nav id="tabs" class="tabs" role="tablist"></nav>
    <div id="view"></div>
  </section>
</main>

<dialog id="dlg"><form method="dialog" id="dlgForm" class="stack"></form></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<div data-site="footer"></div>
<script src="js/rates-data.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
