<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notices - CRTC PUST</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/notice.css">
<meta name="description" content="Official notices and announcements from CRTC, PUST.">
<meta name="theme-color" content="#003366">
<script src="js/site.js" defer></script>
<link rel="canonical" href="https://crtccepust.github.io/notice.html">
<meta property="og:type" content="website">
<meta property="og:locale" content="en_BD">
<meta property="og:title" content="Notice Board | CRTC, PUST">
<meta property="og:description" content="Official notices and announcements from CRTC, PUST.">
<meta property="og:url" content="https://crtccepust.github.io/notice.html">
<meta property="og:image" content="https://crtccepust.github.io/assets/crtc_logo.svg">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" href="assets/crtc_logo.svg">
</head>
<body>
    <div data-site="header"></div>

    <section class="page-hero page-hero--notice">
        <div class="container">
            <h1>Notice Board</h1>
            <p>Official announcements and updates.</p>
        </div>
    </section>

    <div class="notice-container">
        <div class="container" style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:25px">
            <input id="nSearch" type="search" placeholder="Search notices..." aria-label="Search notices" style="flex:1;min-width:220px;padding:12px 16px;border:1px solid #ddd;border-radius:6px;font-size:1rem">
            <select id="nCat" aria-label="Filter by category" style="padding:12px 16px;border:1px solid #ddd;border-radius:6px;font-size:1rem"><option value="">All categories</option></select>
        </div>
        <div class="container" id="notice-list">
            <div style="text-align:center; padding: 60px; color:#666;">
                <i class="fas fa-circle-notch fa-spin" style="font-size: 2rem; color: var(--primary-color);"></i><br><br>
                Syncing with Database...
            </div>
        </div>
    </div>

    <div data-site="footer"></div>

<script src="js/config.js"></script>
<script src="js/notice.js"></script>

</body>
</html>
